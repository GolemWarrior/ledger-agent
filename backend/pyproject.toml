[project]
name = "ledger-agent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=1.2",
    "langgraph-checkpoint-postgres>=2.0",
    "fastapi==0.137.2",
    "anthropic",
    "plaid-python",
    "psycopg[binary]",
    "sqlalchemy[asyncio]",
    "asyncpg",
    "alembic",
    "python-multipart",
    "uvicorn[standard]",
    "pydantic-settings",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ledger_agent"]
